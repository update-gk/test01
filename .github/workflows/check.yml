name: check-prices

on:
  schedule:
    - cron: "*/30 * * * *"   # 30分ごと（GitHub側で数分〜十数分遅れることがあります）
  workflow_dispatch:          # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 価格取得・差額計算・通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_ORIGIN: ${{ secrets.RAKUTEN_ORIGIN }}
        run: python fetch_prices.py

      - name: 結果をコミット（ダッシュボード用）
        run: |
          git config user.name "price-gap-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json docs/state.json
          git diff --cached --quiet || (git commit -m "update prices" && git push)
